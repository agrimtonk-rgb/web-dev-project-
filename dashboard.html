<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Urja Setu</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #faf8f5; color: #1c1917; line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    header { background: #fff; border-bottom: 1px solid #e5e0d8; position: sticky; top: 0; }
    .nav-wrap { max-width: 1200px; margin: auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
    .logo-icon { background: #2e7d52; color: #fff; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    nav a { padding: 7px 16px; border-radius: 6px; font-size: 14.5px; font-weight: 500; color: #555; }
    nav a:hover { color: #111; background: #f0ede6; }
    nav a.active { background: #f5a623; color: #111; font-weight: 600; }
    .container { max-width: 1100px; margin: auto; padding: 40px 20px; }
    .empty-box { max-width: 500px; margin: 40px auto; background: #fff; padding: 40px; text-align: center; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .empty-icon { font-size: 40px; margin-bottom: 15px; color: #888; }
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    .btn-green { background: #2e7d52; color: #fff; font-weight: 600; padding: 10px 22px; border-radius: 6px; display: inline-block; }
    footer { background: #fff; border-top: 1px solid #e5e0d8; text-align: center; padding: 20px; font-size: 13px; color: #888; margin-top: auto; }
  </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Navigation -->
  <header>
    <div class="nav-wrap">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚡</div>
        <span>Urja Setu</span>
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="objectives.html">Objectives</a>
        <a href="report.html">Report Outage</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="reports.html">Reports</a>
        <a href="team.html">Team</a>
        <a href="references.html">References</a>
      </nav>
    </div>
  </header>

  <!-- Empty State Dashboard -->
  <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div class="empty-box">
      <div class="empty-icon">⚠️</div>
      <h1 class="page-title">No Data Available</h1>
      <p style="color: #666; font-size: 15px; margin-bottom: 24px;">Start by reporting your first power outage to see analytics here.</p>
      <a href="report.html" class="btn-green">Report Outage</a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Urja Setu. Bridging Power, Empowering Villages.</p>
  </footer>

</body>
</html>
